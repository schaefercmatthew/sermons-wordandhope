# Netlify configuration for articles.wordandhope.com
# You should not need to edit this file. It tells Netlify:
#  - where the website's files live in this repository (the top level)
#  - to use the _redirects file for any old-link forwarding
#  - to add a couple of safe default security headers
#  - to skip the build entirely unless the commit touched /articles/
#    (keeps the site on Netlify's free build-minutes tier by not
#    rebuilding for transcript fetches, config changes, etc.)

[build]
  publish = "."
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- articles/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
