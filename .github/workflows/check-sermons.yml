# Fetches sermon transcripts and commits them to /transcripts. This workflow
# never calls the Netlify API or a build hook, and must not start doing so:
# transcript-only commits should not burn Netlify build minutes. Netlify's own
# netlify.toml [build] ignore command is what skips the deploy for commits
# that don't touch /articles/.
name: Check for new sermons
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch-transcripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install required packages
        run: pip install requests
      - name: Look for new sermons and save their transcripts
        env:
          SERMONAUDIO_API_KEY: ${{ secrets.SERMONAUDIO_API_KEY }}
        run: python scripts/fetch_transcripts.py
