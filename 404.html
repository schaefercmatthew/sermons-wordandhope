<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Word and Hope</title>
<meta name="description" content="This page doesn't exist. Nothing works perfectly this side of glory.">
<meta name="robots" content="noindex, follow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --ink: #241f1a;
    --ink-soft: #52483e;
    --paper: #fbf7f0;
    --paper-raised: #f3ecdf;
    --rule: #ddd2bd;
    --accent: #8a3324;
    --accent-soft: #f6e6de;
  }

  *{ box-sizing: border-box; }

  html, body{ height:100%; }

  body{
    margin:0;
    min-height:100vh;
    width:100vw;
    background: var(--paper);
    color: var(--ink);
    font-family: 'PT Serif', Georgia, serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    border-top: 6px solid var(--accent);
  }

  a{ color: var(--accent); text-decoration-thickness: 1px; }

  .panel{
    max-width: 720px;
    width:100%;
    text-align:center;
  }

  .eyebrow{
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 22px;
  }

  h1{
    font-family: 'Marcellus', serif;
    font-weight: 400;
    font-size: 3.4rem;
    line-height: 1.2;
    margin: 0 0 28px;
    color: var(--ink);
  }

  p{
    font-size: 21px;
    line-height: 1.65;
    color: var(--ink-soft);
    margin: 0 0 16px;
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }

  p:last-of-type{ margin-bottom: 44px; }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding: 17px 36px;
    border-radius: 3px;
    font-size: 17px;
    text-decoration:none;
    font-family:'PT Serif', serif;
  }

  .btn-primary{
    background: var(--accent);
    color:#fff !important;
  }
  .btn-primary:hover{ background:#a2402e; }

  .fine-print{
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
    font-size: 14px;
    color: var(--ink-soft);
  }

  @media (max-width: 640px){
    body{ padding: 32px 24px; }
    h1{ font-size: 2.1rem; }
    p{ font-size: 17px; }
  }
</style>
</head>
<body>
  <div class="panel">
    <p class="eyebrow">404 &middot; Not Found</p>
    <h1>This link is broken.</h1>
    <p>Which, honestly, is on-brand for a world under the curse.</p>
    <p>Nothing works perfectly this side of glory.</p>
    <a href="/" class="btn btn-primary">Go somewhere that works</a>
    <p class="fine-print">If you followed a link from elsewhere on the site, let us know &mdash; <a href="mailto:matthew@wordandhope.com">matthew@wordandhope.com</a>.</p>
  </div>
</body>
</html>
